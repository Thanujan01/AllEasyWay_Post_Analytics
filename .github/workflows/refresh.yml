name: Refresh dashboard

on:
  schedule:
    # 18:50 UTC = 00:20 Asia/Colombo, so the run always lands just after midnight
    # and the day it closes is a day that has finished.
    - cron: '50 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the job if the site cannot be reached, so a missed day is visible
      # in the Actions tab instead of looking like a day with no posting.
      - name: Crawl and rebuild
        run: python3 collector.py --data data.json --out index.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --quiet --cached || git commit -m "Refresh: $(TZ=Asia/Colombo date '+%Y-%m-%d %H:%M %Z')"
          git push
